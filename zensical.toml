[project]
site_url = "https://devops.roadmap.oaix.tech/"
site_name = "DevOps Roadmap 中文手册"
site_description = "面向 DevOps、SRE 与平台工程学习者的中文原创实用手册"
site_author = "oaixnah"

# copyright = "Copyright &copy; 2026 Your name"

#repo_url = "https://github.com/oaixnah/roadmap-devops"
#repo_name = "oaixnah/roadmap-devops"

nav = [
    { "首页" = "index.md" },
    { "基础能力" = [
        { "学习一种编程语言" = "learn-a-programming-language.md" },
        { "操作系统" = "operating-system.md" },
        { "终端知识" = "terminal-knowledge.md" },
        { "版本控制系统" = "version-control-systems.md" },
        { "版本控制托管" = "vcs-hosting.md" },
        { "容器" = "containers.md" },
    ] },
    { "基础设施与云" = [
        { "常见基础设施服务" = "common-infrastructure-services.md" },
        { "网络与协议" = "networking-and-protocols.md" },
        { "云服务商" = "cloud-providers.md" },
        { "无服务器计算" = "serverless.md" },
        { "基础设施置备" = "provisioning.md" },
        { "配置管理" = "configuration-management.md" },
    ] },
    { "持续交付与运行" = [
        { "CI/CD 工具" = "ci-cd-tools.md" },
        { "机密管理" = "secret-management.md" },
        { "基础设施监控" = "infrastructure-monitoring.md" },
        { "日志管理" = "logs-management.md" },
        { "容器编排" = "container-orchestration.md" },
        { "可观测性" = "observability.md" },
    ] },
    { "平台与架构治理" = [
        { "制品管理" = "artifact-management.md" },
        { "GitOps" = "gitops.md" },
        { "服务网格" = "service-mesh.md" },
        { "云设计模式" = "cloud-design-patterns.md" },
    ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
language = "zh"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    # "toc.integrate",
]

logo = "assets/logo.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.extra.analytics]
provider = "google"
property = "G-FLXQC4YQJF"
clarity = "y3p2irnl2z"

[project.markdown_extensions]
abbr = { }
admonition = { }
attr_list = { }
def_list = { }
footnotes = { }
md_in_html = { }
toc = {
    permalink = true
}
pymdownx.arithmatex = {
    generic = true
}
pymdownx.betterem = { }
pymdownx.caret = { }
pymdownx.details = { }
pymdownx.emoji = {
    emoji_generator = "zensical.extensions.emoji.to_svg",
    emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
    anchor_linenums = true,
    line_spans = "__span",
    pygments_lang_class = true,
}
pymdownx.inlinehilite = { }
pymdownx.keys = { }
pymdownx.magiclink = { }
pymdownx.mark = { }
pymdownx.smartsymbols = { }
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
    custom_fences = [
        {
            name = "mermaid",
            class = "mermaid",
            format = "pymdownx.superfences.fence_code_format",
        },
    ],
}
pymdownx.tabbed = {
    alternate_style = true,
    combine_header_slug = true
}
pymdownx.tasklist = {
    custom_checkbox = true
}
pymdownx.tilde = { }
